<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Space Shooter</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    body { margin: 0; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
<script>
// Phaser 3 must be included in your HTML before this script

const config = {
  type: Phaser.AUTO,
  width: 480,
  height: 800,
  backgroundColor: '#000000',
  physics: {
    default: 'arcade',
    arcade: {
      debug: false
    }
  },
  scene: {
    preload: preload,
    create: create,
    update: update
  }
};

const game = new Phaser.Game(config);

let player;
let bullets;
let cursors;
let lastFired = 0;
let enemies = [];
let health = 10;
let gameOverText, restartButton;

function preload() {
  this.load.image('player', 'https://labs.phaser.io/assets/sprites/space-baddie.png');
}

function create() {
  // Звездный фон
  this.stars = this.add.group({ key: 'star', repeat: 100 });
  for (let i = 0; i < 100; i++) {
    const x = Phaser.Math.Between(0, config.width);
    const y = Phaser.Math.Between(0, config.height);
    const size = Phaser.Math.Between(0.5, 1);
    const star = this.add.circle(x, y, size, 0xFFE2E8E3);
    this.stars.add(star);
  }

  bullets = this.physics.add.group();

  player = this.physics.add.sprite(config.width / 2, config.height - 50, 'player');
  player.setCollideWorldBounds(true);
  player.setScale(0.8);

  this.input.on('pointermove', pointer => {
    this.physics.moveTo(player, pointer.x, pointer.y, 300);
  });

  this.time.addEvent({
    delay: 1000,
    callback: spawnEnemyGroup,
    callbackScope: this,
    loop: true
  });

  this.time.addEvent({
    delay: 500,
    callback: fireBullet,
    callbackScope: this,
    loop: true
  });

  gameOverText = this.add.text(config.width / 2, config.height / 2, 'Game Over', {
    fontSize: '48px', fill: '#fff'
  }).setOrigin(0.5).setVisible(false);

  restartButton = this.add.text(config.width / 2, config.height / 2 + 60, 'Play Again', {
    fontSize: '32px', fill: '#fff', backgroundColor: '#333', padding: 10
  }).setOrigin(0.5).setInteractive().setVisible(false);

  restartButton.on('pointerdown', () => this.scene.restart());
}

function update() {
  Phaser.Actions.IncY(this.stars.getChildren(), 1);
  this.stars.getChildren().forEach(star => {
    if (star.y > config.height) star.y = 0;
  });

  bullets.children.each(b => {
    if (b.active && b.y < -10) b.destroy();
  });

  // Проверка на коллизии пуль с врагами
  this.physics.world.collide(bullets, enemies, hitEnemy, null, this);
  // Проверка на коллизии врагов с игроком
  this.physics.world.collide(player, enemies, hitPlayer, null, this);
}

function fireBullet() {
  if (health <= 0) return;

  const bullet = bullets.create(player.x, player.y - 20, null);
  bullet.setSize(2, 5);
  bullet.setFillStyle(0xffffff, 1);
  bullet.setVelocityY(-300);
  bullet.setData('custom', true);
}

function hitEnemy(bullet, enemy) {
  bullet.destroy();
  enemy.hp--;

  if (enemy.hp <= 0) {
    enemy.destroy();
  }
}

function hitPlayer(player, enemy) {
  health--;
  enemy.destroy();

  if (health <= 0) {
    player.setVisible(false);
    gameOverText.setVisible(true);
    restartButton.setVisible(true);
  }
}

function spawnEnemyGroup() {
  const scene = this;
  const count = Phaser.Math.Between(3, 5);
  enemies = [];

  for (let i = 0; i < count; i++) {
    const type = Phaser.Math.RND.pick(['circle', 'triangle', 'square']);
    const targetX = Phaser.Math.Between(60, config.width - 60);
    const targetY = Phaser.Math.Between(40, config.height / 2);

    let startX = Phaser.Math.RND.pick([-30, config.width + 30]);
    let startY = -30;

    let enemy;
    if (type === 'circle') {
      enemy = scene.add.circle(startX, startY, 15, 0xffffff);
      enemy.hp = 1;
      this.physics.add.existing(enemy);
    } else if (type === 'triangle') {
      enemy = scene.add.polygon(startX, startY, [0, 20, -15, -15, 15, -15], 0xffff00);
      enemy.hp = 2;
      this.physics.add.existing(enemy);
    } else if (type === 'square') {
      enemy = scene.add.rectangle(startX, startY, 30, 30, 0xff0000);
      enemy.hp = 3;
      this.physics.add.existing(enemy);
    }

    enemy.type = type;
    enemies.push(enemy);

    if (type === 'circle') {
      const controlX = (startX + targetX) / 2 + Phaser.Math.Between(-100, 100);
      const controlY = startY + Phaser.Math.Between(50, 150);
      const curve = new Phaser.Curves.QuadraticBezier(
        new Phaser.Math.Vector2(startX, startY),
        new Phaser.Math.Vector2(controlX, controlY),
        new Phaser.Math.Vector2(targetX, targetY)
      );
      const duration = 3000;
      scene.tweens.addCounter({
        from: 0, to: 1, duration,
        onUpdate: tween => {
          const t = tween.getValue();
          const point = curve.getPoint(t);
          enemy.setPosition(point.x, point.y);
        }
      });
    } else if (type === 'triangle') {
      const duration = 2000;
      const amplitude = Phaser.Math.Between(20, 40);
      const baseY = targetY;
      scene.tweens.addCounter({
        from: 0, to: 1, duration,
        onUpdate: tween => {
          const t = tween.getValue();
          const x = Phaser.Math.Interpolation.Linear([startX, targetX], t);
          const y = Phaser.Math.Interpolation.Linear([startY, baseY], t) + amplitude * Math.sin(t * 8 * Math.PI);
          enemy.setPosition(x, y);
        }
      });
    } else if (type === 'square') {
      const midX = config.width - targetX;
      const midY = targetY / 2;
      const duration1 = 1500;
      const duration2 = 2000;

      scene.tweens.add({
        targets: enemy,
        x: midX, y: midY,
        duration: duration1,
        ease: 'Linear',
        onComplete: () => {
          scene.time.delayedCall(5000, () => {
            scene.tweens.add({
              targets: enemy,
              x: targetX, y: targetY,
              duration: duration2,
              ease: 'Power1'
            });
          });
        }
      });
    }
  }
}

new Phaser.Game(config);
</script>
</body>
</html>
