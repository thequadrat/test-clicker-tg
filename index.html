<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Space Shooter</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    body { margin: 0; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
<script>
const config = {
  type: Phaser.AUTO,
  width: 480,
  height: 720,
  backgroundColor: '#000000',
  scene: {
    preload,
    create,
    update
  }
};

let stars = [];
let player;
let bullets = [];
let enemies = [];
let speed = 3;
let gameOver = false;

function preload() {}

function create() {
  // Звезды
  for (let i = 0; i < 100; i++) {
    const x = Phaser.Math.Between(0, this.sys.game.config.width);
    const y = Phaser.Math.Between(0, this.sys.game.config.height);
    const size = Phaser.Math.Between(0.5, 1);
    const star = this.add.circle(x, y, size, 0xFFE2E8E3);
    star.speed = Phaser.Math.FloatBetween(0.5, 2);
    stars.push(star);
  }

  // Игрок
  player = this.add.rectangle(config.width / 2, config.height - 50, 30, 20, 0x00ffff);
  this.input.on('pointermove', (pointer) => {
    player.x = pointer.x;
    player.y = pointer.y;
  });

  // Стрельба
  this.time.addEvent({
    delay: 500,
    callback: () => {
      if (!gameOver) {
        const bullet = this.add.rectangle(player.x, player.y - 30, 5, 10, 0xffffff);
        bullets.push(bullet);
      }
    },
    loop: true
  });

  spawnEnemyGroup.call(this);
}

  const speed = Phaser.Math.Between(30, 50);

    const targetY = Phaser.Math.Between(40, config.height / 2);

    const side = Phaser.Math.RND.pick(['top-left', 'top-right']);
    let startX, startY;

    if (side === 'top-left') {
      startX = -30;
      startY = -30;
    } else {
      startX = config.width + 30;
      startY = -30;
    }

    let enemy;
    if (type === 'circle') {

      enemy.type = 'circle';
      enemy.hp = 1;
