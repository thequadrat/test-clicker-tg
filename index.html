<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Space Shooter</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    body { margin: 0; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
<script>
const config = {
  type: Phaser.AUTO,
  width: 480,
  height: 720,
  backgroundColor: '#000000',
  scene: {
    preload,
    create,
    update
  }
};

let stars = [];
let player;
let bullets = [];
let enemies = [];
let speed = 3;
let gameOver = false;

function preload() {}

function create() {
  // Звезды
  for (let i = 0; i < 100; i++) {
    const x = Phaser.Math.Between(0, this.sys.game.config.width);
    const y = Phaser.Math.Between(0, this.sys.game.config.height);
    const size = Phaser.Math.Between(0.5, 1);
    const star = this.add.circle(x, y, size, 0xFFE2E8E3);
    star.speed = Phaser.Math.FloatBetween(0.5, 2);
    stars.push(star);
  }

  // Игрок
  player = this.add.rectangle(config.width / 2, config.height - 50, 30, 20, 0x00ffff);
  this.input.on('pointermove', (pointer) => {
    player.x = pointer.x;
    player.y = pointer.y;
  });

  // Стрельба
  this.time.addEvent({
    delay: 500,
    callback: () => {
      if (!gameOver) {
        const bullet = this.add.rectangle(player.x, player.y - 30, 5, 10, 0xffffff);
        bullets.push(bullet);
      }
    },
    loop: true
  });

  spawnEnemyGroup.call(this);
}

function spawnEnemyGroup() {
  enemies = [];
  const count = Phaser.Math.Between(3, 5);

  for (let i = 0; i < count; i++) {
    const type = Phaser.Math.RND.pick(['circle', 'triangle', 'square']);
    const targetX = Phaser.Math.Between(60, config.width - 60);
    const targetY = Phaser.Math.Between(40, config.height / 2);

    let startX, startY;

    if (type === 'circle') {
      startX = Phaser.Math.RND.pick([-30, config.width + 30]);
      startY = -30;
    } else {
      startX = Phaser.Math.RND.pick([-30, config.width + 30]);
      startY = -30;
    }

    let enemy;
    if (type === 'circle') {
      enemy = this.add.circle(startX, startY, 15, 0xffffff);
      enemy.hp = 1;
    } else if (type === 'triangle') {
      enemy = this.add.polygon(startX, startY, [0, 20, -15, -15, 15, -15], 0xffff00);
      enemy.hp = 2;
    } else if (type === 'square') {
      enemy = this.add.rectangle(startX, startY, 30, 30, 0xff0000);
      enemy.hp = 3;
    }

    enemy.type = type;
    enemies.push(enemy);

    if (type === 'circle') {
      // Плавная кривая
      const controlX = (startX + targetX) / 2 + Phaser.Math.Between(-100, 100);
      const controlY = startY + Phaser.Math.Between(50, 150);
      const curve = new Phaser.Curves.QuadraticBezier(
        new Phaser.Math.Vector2(startX, startY),
        new Phaser.Math.Vector2(controlX, controlY),
        new Phaser.Math.Vector2(targetX, targetY)
      );
      const duration = 3000;

      this.tweens.addCounter({
        from: 0, to: 1, duration,
        onUpdate: (tween) => {
          const t = tween.getValue();
          const point = curve.getPoint(t);
          enemy.setPosition(point.x, point.y);
        }
      });

    } else if (type === 'triangle') {
      // Синусоида
      const duration = 2000;
      const amplitude = Phaser.Math.Between(20, 40);
      const baseY = targetY;
      const startTime = this.time.now;

      this.tweens.addCounter({
        from: 0, to: 1, duration,
        onUpdate: (tween) => {
          const t = tween.getValue();
          const x = Phaser.Math.Interpolation.Linear([startX, targetX], t);
          const y = Phaser.Math.Interpolation.Linear([startY, baseY], t) + amplitude * Math.sin(t * 8 * Math.PI);
          enemy.setPosition(x, y);
        }
      });

    } else if (type === 'square') {
      // Промежуточная остановка
      const midX = config.width - targetX; // зеркальная по горизонтали
      const midY = targetY / 2;
      const duration1 = 1500;
      const duration2 = 2000;

      this.tweens.add({
        targets: enemy,
        x: midX, y: midY,
        duration: duration1,
        ease: 'Linear',
        onComplete: () => {
          this.time.delayedCall(5000, () => {
            this.tweens.add({
              targets: enemy,
              x: targetX, y: targetY,
              duration: duration2,
              ease: 'Power1'
            });
          });
        }
      });
    }
  }
}





function update() {
  if (gameOver) return;

  // Анимация звезд
  for (let star of stars) {
    star.y += star.speed;
    if (star.y > config.height) {
      star.y = 0;
      star.x = Phaser.Math.Between(0, config.width);
    }
  }

  // Движение врагов (влево-вправо)
  for (let enemy of enemies) {
    enemy.x += 0.5 * enemy.direction;
    if (enemy.x < 20 || enemy.x > config.width - 20) {
      enemy.direction *= -1;
    }
  }

  // Движение пуль
  for (let i = 0; i < bullets.length; i++) {
    const bullet = bullets[i];
    bullet.y -= 5;
    if (bullet.y < 0) {
      bullet.destroy();
      bullets.splice(i, 1);
      i--;
      continue;
    }

    // Проверка попадания по врагам
    for (let j = 0; j < enemies.length; j++) {
      const enemy = enemies[j];
      const dx = bullet.x - enemy.x;
      const dy = bullet.y - enemy.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 15) {
        bullet.destroy();
        bullets.splice(i, 1);
        i--;
        enemy.hp--;
        if (enemy.hp <= 0) {
          enemy.destroy();
          enemies.splice(j, 1);
        }
        break;
      }
    }
  }

  // Все враги уничтожены — спавн новой группы
  if (enemies.length === 0) {
    spawnEnemyGroup.call(this);
  }
}

new Phaser.Game(config);
</script>
</body>
</html>
