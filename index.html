<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Space Shooter</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    body { margin: 0; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
<script>
const config = {
  type: Phaser.AUTO,
  width: 480,
  height: 720,
  backgroundColor: '#000000',
  scene: {
    preload,
    create,
    update
  }
};

let stars = [];
let player;
let bullets = [];
let enemies = [];
let speed = 3;
let gameOver = false;

function preload() {}

function create() {
  // Звезды
  for (let i = 0; i < 100; i++) {
    const x = Phaser.Math.Between(0, this.sys.game.config.width);
    const y = Phaser.Math.Between(0, this.sys.game.config.height);
    const size = Phaser.Math.Between(0.5, 1);
    const star = this.add.circle(x, y, size, 0xFFE2E8E3);
    star.speed = Phaser.Math.FloatBetween(0.5, 2);
    stars.push(star);
  }

  // Игрок
  player = this.add.rectangle(config.width / 2, config.height - 50, 30, 20, 0x00ffff);
  this.input.on('pointermove', (pointer) => {
    player.x = pointer.x;
    player.y = pointer.y;
  });

  // Стрельба
  this.time.addEvent({
    delay: 500,
    callback: () => {
      if (!gameOver) {
        const bullet = this.add.rectangle(player.x, player.y - 30, 5, 10, 0xffffff);
        bullets.push(bullet);
      }
    },
    loop: true
  });

  spawnEnemyGroup.call(this);
}

function spawnEnemyGroup() {
  enemies = [];
  const count = Phaser.Math.Between(3, 5);
  for (let i = 0; i < count; i++) {
    const x = Phaser.Math.Between(50, config.width - 50);
    const y = Phaser.Math.Between(50, config.height / 2);
    const enemy = this.add.circle(x, y, 15, 0xffffff);
    enemy.type = 'circle';
    enemy.hp = 1;
    enemy.direction = Math.random() < 0.5 ? -1 : 1;
    enemies.push(enemy);
  }
}

function update() {
  if (gameOver) return;

  // Анимация звезд
  for (let star of stars) {
    star.y += star.speed;
    if (star.y > config.height) {
      star.y = 0;
      star.x = Phaser.Math.Between(0, config.width);
    }
  }

  // Движение врагов (влево-вправо)
  for (let enemy of enemies) {
    enemy.x += 0.5 * enemy.direction;
    if (enemy.x < 20 || enemy.x > config.width - 20) {
      enemy.direction *= -1;
    }
  }

  // Движение пуль
  for (let i = 0; i < bullets.length; i++) {
    const bullet = bullets[i];
    bullet.y -= 5;
    if (bullet.y < 0) {
      bullet.destroy();
      bullets.splice(i, 1);
      i--;
      continue;
    }

    // Проверка попадания по врагам
    for (let j = 0; j < enemies.length; j++) {
      const enemy = enemies[j];
      const dx = bullet.x - enemy.x;
      const dy = bullet.y - enemy.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 15) {
        bullet.destroy();
        bullets.splice(i, 1);
        i--;
        enemy.hp--;
        if (enemy.hp <= 0) {
          enemy.destroy();
          enemies.splice(j, 1);
        }
        break;
      }
    }
  }

  // Все враги уничтожены — спавн новой группы
  if (enemies.length === 0) {
    spawnEnemyGroup.call(this);
  }
}

new Phaser.Game(config);
</script>
</body>
</html>
