<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Space Shooter</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    body { margin: 0; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
<script>
const config = {
  type: Phaser.AUTO,
  width: 480,
  height: 720,
  backgroundColor: '#000000',
  scene: {
    preload,
    create,
    update
  }
};

const STAR_COUNT = 100;
let stars = [];

function preload() {}

function create() {
  for (let i = 0; i < STAR_COUNT; i++) {
    const x = Phaser.Math.Between(0, this.sys.game.config.width);
    const y = Phaser.Math.Between(0, this.sys.game.config.height);
    const size = Phaser.Math.Between(1, 2); // Уменьшили размер звезд
    const speed = Phaser.Math.FloatBetween(0.5, 2);
    const star = this.add.circle(x, y, size, Phaser.Math.Between(50, 200)); // Цвет в диапазоне серого
    star.speed = speed;
    stars.push(star);
  }
}

function update() {
  const height = this.sys.game.config.height;
  for (let star of stars) {
    star.y += star.speed;
    if (star.y > height) {
      star.y = 0;
      star.x = Phaser.Math.Between(0, this.sys.game.config.width);
    }
  }
}

new Phaser.Game(config);
</script>
</body>
</html>
